server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/payments/ {
        proxy_pass http://api:8086/;
        proxy_set_header Host $host;
    }
    location /api/cases/ {
        proxy_pass http://cases-api:18087/;
        proxy_set_header Host $host;
    }
    location / {
        try_files $uri /index.html;
    }
}
