# Static console only. In the packaged stack the gateway (deploy/gateway.conf.template)
# signs people in and routes /api/payments/ and /api/cases/ to the services.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
