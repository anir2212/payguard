name: PayGuard CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: ./gradlew test --no-daemon
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra serve --extra export --extra agent --extra test
        working-directory: fraud
      - run: uv run --no-sync ruff check src tests
        working-directory: fraud
      - run: uv run --no-sync pytest -q tests
        working-directory: fraud
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
  images:
    runs-on: ubuntu-latest
    needs: [kotlin, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.api -t payguard-api:ci .
      - run: docker build -f fraud/Dockerfile -t payguard-score:ci fraud
      - run: docker build -f frontend/Dockerfile -t payguard-console:ci frontend
