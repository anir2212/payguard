[project]
name = "payguard-fraud"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "lightgbm>=4.6,<5", "pyarrow>=18,<30", "joblib>=1.4,<2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "onnxruntime>=1.22,<2", "redis>=6,<7", "confluent-kafka>=2.6,<3"]
export = ["onnxmltools>=1.14,<2", "skl2onnx>=1.19,<2"]
agent = ["langgraph>=1,<2", "httpx>=0.27,<1"]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payguard_fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
