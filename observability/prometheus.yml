global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: payguard-auth
    static_configs:
      - targets: [host.docker.internal:8086]
  - job_name: payguard-score
    static_configs:
      - targets: [host.docker.internal:18086]
